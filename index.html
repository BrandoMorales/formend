<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario avanzado</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Formulario  SENA v1</h1>
        <h4>gracias por dejar tus datos</h4>

        <form id="miFormulario">
            <div class="form-group">
              <label for="nombre">Nombres</label>
              <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre " pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]{3,40}" />
            </div>

            <div class="form-group">
    <label for="email">Correo electrónico:</label>
    <input
      type="email"
      id="email"
      name="email"
      required
      placeholder="ejemplo@correo.com"
      oncopy="return false"
      onpaste="return false"
      oncut="return false"
    />
    <div class="error" id="errorEmail"></div>
</div>

  <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="18" max="100" required placeholder="Tu edad" />
            </div>

 <div class="section">
        <label for="optionSelect">escoje una opcion</label>
        <select id="optionSelect">
            <option>Selecciona una opcion</option>
            <option>futbol</option>
            <option>baloncesto</option>
            <option>hockey</option>
        </select>
    </div>
    <br>

    <div class="section">
        <label>¿Planeas iniciar un torneo de algun deporte este año?</label>
        <input type="radio" name="buyCar" value="Yes"> si<br>
        <input type="radio" name="buyCar" value="No"> No<br>
        <input type="radio" name="buyCar" value="Maybe">tal vezz 
    </div>
    <br>

    <div class="section">
        <label for="carBrand">¿Cuál es tu marca deportiva favorita?</label>
        <select id="carBrand">
            <option>Selecciona una opcion</option>
            <option>mcr</option>
            <option>nike</option>
            <option>adidas</option>
            <option>puma</option>
            <option>mizuno</option>
            <option>joma</option>
        </select>
    </div>
    <br>

    <div class="section">
        <label>¿Qué deporte practica actualmente</label>
        <input type="checkbox" name="deporte" value="futbol"> futbol<br>
        <input type="checkbox" name="deporte" value="golf"> golf<br>
        <input type="checkbox" name="deporte" value="baloncesto"> baloncesto<br>
        <input type="checkbox" name="deporte" value="Carreras"> carreras<br>
         <input type="checkbox" name="deporte" value="rugby"> rugby<br>
    
    </div>

            <div class="form-group">
                <label for="comentarios">comentarios:</label>
                <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea>
            </div>

            <button type="submit">✅ Enviar Formulario</button>
        </form>

        <div id="resultado" class="resultado">
            <h3>✅ ¡Formulario enviado exitosamente!</h3>
            <p>Estos son los datos que enviaste:</p>
            <div id="datosEnviados"></div>
        </div>
    </div>
    <div class="form-group">
  <label for="programadorA">Programador A:</label>
  <input type="number" id="programadorA" name="programadorA" required />
</div>

<div class="form-group">
  <label for="programadorB">Programador B:</label>
  <input type="number" id="programadorB" name="programadorB" required />
</div>
 
    <script src="scripth.js"></script>
</body>
</html>
